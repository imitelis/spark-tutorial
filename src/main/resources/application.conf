app {
  name = "spark-tutorial"
  version = "0.1.0"
}

spark {
  master = "local[*]"
  app.name = "spark-tutorial"

  # Production overrides via env vars:
  # SPARK_MASTER=yarn spark-submit ...
  # SPARK_MEMORY=4g spark-submit ...

  config {
    spark.sql.shuffle.partitions = 200
    spark.sql.adaptive.enabled = true
  }
}

input {
  base.path = "data"
  crimes.path = ${input.base.path}"/crimes_sample.csv"
}

output {
  base.path = "output"
  csv.path = ${output.base.path}"/csv"
  parquet.path = ${output.base.path}"/parquet"
}

logging {
  level = "INFO"
}
